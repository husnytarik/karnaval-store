<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Yönetim Paneli</title><link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="loginView" class="login" hidden>
  <img src="/logo.png" alt="Karnaval" style="width:100%;max-width:220px;display:block;margin:0 auto 10px"><h2 style="margin-top:0;text-align:center">Yönetim Girişi</h2>
  <form id="loginForm">
    <label>Şifre</label><input type="password" id="pw" autofocus required>
    <p><button class="btn" style="width:100%">Giriş</button></p>
  </form>
</div>

<div id="appView" hidden>
<header class="top admin"><div class="wrap">
  <span class="logo"><img src="/logo.png" alt="Karnaval"></span><strong style="margin-left:10px">Yönetim</strong>
  <a class="btn ghost sm" href="/" target="_blank">Siteyi gör</a>
  <button class="btn ghost sm cart-btn" id="logout">Çıkış</button>
</div></header>

<main class="wrap">
  <div class="tabs">
    <button class="tab on" data-tab="products">Ürünler</button>
    <button class="tab" data-tab="categories">Kategoriler</button>
    <button class="tab" data-tab="orders">Siparişler</button>
  </div>

  <section id="products">
    <div class="panel" id="formPanel">
      <h3 id="formTitle" style="margin-top:0">Yeni ürün</h3>
      <form id="pform">
        <div class="two">
          <div><label>Ürün adı</label><input type="text" id="f_name" required></div>
          <div><label>Kategori</label><select id="f_cat"></select></div>
          <div><label>Fiyat (₺)</label><input type="number" id="f_price" step="0.01" min="0" required></div>
          <div id="stockWrap"><label>Stok adedi</label><input type="number" id="f_stock" min="0" value="0"></div>
        </div>
        <label>Kısa açıklama <small>(ürün kartında görünür)</small></label>
        <textarea id="f_desc" style="min-height:60px"></textarea>
        <label>Detaylı açıklama <small>(ürün sayfasında görünür; satır başları korunur)</small></label>
        <textarea id="f_details" style="min-height:140px"></textarea>

        <label>Fotoğraflar <small>(ilk fotoğraf ana görseldir; birden fazla seçebilirsiniz)</small></label>
        <input type="file" id="f_file" accept="image/*" multiple>
        <div class="imgs" id="imgs"></div>

        <fieldset class="opts">
          <legend>Renk ve boy seçenekleri (isteğe bağlı)</legend>
          <div class="two">
            <div><label>Seçenek adı</label><input type="text" id="f_sizelabel" value="Boy" placeholder="Boy, Beden, Ebat…"></div>
            <div><label>Değerler <small>(virgülle ayırın)</small></label><input type="text" id="f_sizes" placeholder="A5, A4, A3"></div>
          </div>
          <label>Renkler <small>(her renge kendi fotoğraflarını ekleyin; müşteri rengi seçince fotoğraflar değişir)</small></label>
          <div id="colors"></div>
          <p style="margin:10px 0 0"><button type="button" class="btn ghost sm" id="addColor">+ Renk ekle</button></p>
          <div id="stockGrid"></div>
        </fieldset>

        <fieldset class="sale">
          <legend>İndirim (isteğe bağlı)</legend>
          <div class="three">
            <div><label>İndirimli fiyat (₺)</label><input type="number" id="f_sale" step="0.01" min="0" placeholder="Boş = indirim yok"></div>
            <div><label>Başlangıç tarihi</label><input type="date" id="f_sstart"></div>
            <div><label>Bitiş tarihi</label><input type="date" id="f_send"></div>
          </div>
          <small style="color:var(--muted)">Tarihleri boş bırakırsanız indirim hemen başlar ve kaldırılana kadar sürer.</small>
        </fieldset>

        <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="f_active" checked> Sitede göster</label>
        <p style="margin-bottom:0"><button class="btn" id="saveBtn">Kaydet</button>
          <button type="button" class="btn ghost" id="cancelEdit" hidden>Vazgeç</button></p>
      </form>
    </div>
    <div class="scroll"><table><thead><tr><th></th><th>Ürün</th><th>Kategori</th><th>Fiyat</th><th>Stok</th><th></th></tr></thead>
      <tbody id="ptable"></tbody></table></div>
  </section>

  <section id="categories" hidden>
    <div class="panel">
      <form id="cform">
        <div class="two"><div><label>Kategori adı</label><input type="text" id="c_name" placeholder="Ör. Kalemler" required></div>
          <div><label>Kategori görseli</label><input type="file" id="c_file" accept="image/*"></div></div>
        <p style="margin-bottom:0"><button class="btn">Kategori ekle</button></p>
      </form>
    </div>
    <table><tbody id="ctable"></tbody></table>
  </section>

  <section id="orders" hidden>
    <div class="scroll"><table><thead><tr><th>#</th><th>Müşteri</th><th>Ürünler</th><th>Toplam</th><th>Durum</th></tr></thead>
      <tbody id="otable"></tbody></table></div>
  </section>
</main>
</div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const tl = n => Number(n).toLocaleString('tr-TR', { style: 'currency', currency: 'TRY' });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 2800); }
async function api(path, method = 'GET', data) {
  const res = await fetch('/api/' + path, { method, headers: { 'content-type': 'application/json' }, body: data ? JSON.stringify(data) : undefined });
  const out = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== 'login') { showLogin(); throw new Error(out.error); }
  if (!res.ok) { toast(out.error || 'Hata'); throw new Error(out.error); }
  return out;
}
let cats = [], prods = [], editing = null;

function showLogin() { $('#loginView').hidden = false; $('#appView').hidden = true; }
async function showApp() { $('#loginView').hidden = true; $('#appView').hidden = false; await loadCats(); await loadProducts(); }

$('#loginForm').onsubmit = async e => {
  e.preventDefault();
  try { await api('login', 'POST', { password: $('#pw').value }); $('#pw').value = ''; showApp(); } catch {}
};
$('#logout').onclick = async () => { await api('logout', 'POST'); showLogin(); };
document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  ['products', 'categories', 'orders'].forEach(s => $('#' + s).hidden = s !== b.dataset.tab);
  if (b.dataset.tab === 'orders') loadOrders();
});

// ---- kategoriler ----
async function loadCats() {
  cats = await (await fetch('/api/categories')).json();
  $('#f_cat').innerHTML = '<option value="">— Kategorisiz —</option>' + cats.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
  $('#ctable').innerHTML = cats.map(c => `<tr><td style="width:70px">${c.image_id ? `<img src="/api/images/${c.image_id}">` : '<div class="thumb-ph"></div>'}</td><td><strong>${esc(c.name)}</strong><br><small>${c.n} ürün</small></td><td style="text-align:right;white-space:nowrap"><label class="btn ghost sm" style="margin:0;cursor:pointer">Görsel ${c.image_id ? 'değiştir' : 'ekle'}<input type="file" accept="image/*" data-catimg="${c.id}" hidden></label> <button class="btn danger sm" data-delcat="${c.id}">Sil</button></td></tr>`).join('')
    || '<tr><td>Henüz kategori yok.</td></tr>';
}
$('#cform').onsubmit = async e => {
  e.preventDefault();
  const f = $('#c_file').files[0];
  const image_id = f ? await uploadFile(f) : null;
  await api('admin/categories', 'POST', { name: $('#c_name').value, image_id }); $('#c_name').value = ''; $('#c_file').value = '';
  toast('Kategori eklendi'); await loadCats();
};

// ---- ürünler ----
let gallery = [];
function saleBadge(p) {
  if (p.sale_price == null) return '';
  if (p.on_sale) return ' <span class="badge sale">İndirimde</span>';
  const t = new Date().toISOString().slice(0, 10);
  if (p.sale_start && p.sale_start > t) return ' <span class="badge">İndirim ' + p.sale_start + '</span>';
  return ' <span class="badge off">İndirim bitti</span>';
}
async function loadProducts() {
  prods = await api('admin/products');
  $('#ptable').innerHTML = prods.map(p => `<tr>
    <td>${p.image_id ? `<img src="/api/images/${p.image_id}">` : '<div class="thumb-ph"></div>'}</td>
    <td><strong>${esc(p.name)}</strong> ${p.active ? '' : '<span class="badge off">gizli</span>'}</td>
    <td>${esc(p.category || '—')}</td>
    <td>${p.on_sale ? `<s style="color:var(--muted)">${tl(p.price)}</s><br><strong>${tl(p.sale_price)}</strong>` : tl(p.price)}${saleBadge(p)}</td>
    <td>${p.stock}</td>
    <td style="text-align:right;white-space:nowrap"><a class="btn ghost sm" href="/urun.html?id=${p.id}" target="_blank">Gör</a>
      <button class="btn ghost sm" data-edit="${p.id}">Düzenle</button>
      <button class="btn danger sm" data-del="${p.id}">Sil</button></td></tr>`).join('')
    || '<tr><td colspan="6">Henüz ürün yok. Yukarıdan ilk ürünü ekleyin.</td></tr>';
}
function renderImgs() {
  $('#imgs').innerHTML = gallery.map((id, i) => `<div class="gi">
    <div class="gimg" style="background-image:url(/api/images/${id})"></div>
    <div class="gbtns">${i === 0 ? '<span class="badge sale">Ana</span>' : `<button type="button" class="btn ghost sm" data-main="${i}">Ana yap</button>`}
      <button type="button" class="btn danger sm" data-rmimg="${i}">Kaldır</button></div></div>`).join('');
}
// ---- renk / boy ----
let colors = [], plain = {};
const parseSizes = () => [...new Set($('#f_sizes').value.split(',').map(x => x.trim()).filter(Boolean))];
function renderColors() {
  $('#colors').innerHTML = colors.map((c, i) => `<div class="ccard">
    <div class="crow"><input type="text" data-cname="${i}" value="${esc(c.name)}" placeholder="Renk adı (ör. Kırmızı)">
      <label class="btn ghost sm" style="margin:0;cursor:pointer">Fotoğraf ekle<input type="file" accept="image/*" multiple data-cfile="${i}" hidden></label>
      <button type="button" class="btn danger sm" data-cdel="${i}">Rengi sil</button></div>
    <div class="imgs">${c.gallery.map((id, j) => `<div class="gi" style="width:90px"><div class="gimg" style="width:90px;height:90px;background-image:url(/api/images/${id})"></div>
      <div class="gbtns"><button type="button" class="btn danger sm" data-crm="${i}:${j}">Kaldır</button></div></div>`).join('')}</div></div>`).join('');
  renderStock();
}
function renderStock() {
  const sizes = parseSizes(), rows = colors.length ? colors : [{ name: '', stock: plain }];
  const has = colors.length || sizes.length;
  $('#stockWrap').hidden = !!has;
  if (!has) { $('#stockGrid').innerHTML = ''; return; }
  const cols = sizes.length ? sizes : [''];
  $('#stockGrid').innerHTML = '<label style="margin-top:14px">Seçenek başına stok adedi</label><table class="vgrid"><thead><tr><th></th>'
    + cols.map(z => `<th>${esc(z || 'Stok')}</th>`).join('') + '</tr></thead><tbody>'
    + rows.map((c, i) => `<tr><td>${esc(c.name || (colors.length ? '(adsız renk)' : '—'))}</td>${cols.map(z =>
      `<td><input type="number" min="0" data-st="${colors.length ? i : -1}|${esc(z)}" value="${c.stock[z] ?? 0}"></td>`).join('')}</tr>`).join('') + '</tbody></table>';
}
$('#addColor').onclick = () => { colors.push({ name: '', gallery: [], stock: {} }); renderColors(); };
$('#f_sizes').oninput = renderStock;
document.addEventListener('input', e => {
  const d = e.target.dataset;
  if (d.cname !== undefined) { colors[+d.cname].name = e.target.value; renderStock(); }
  if (d.st !== undefined) {
    const [i, z] = d.st.split('|'), n = Math.max(0, parseInt(e.target.value, 10) || 0);
    (+i < 0 ? plain : colors[+i].stock)[z] = n;
  }
});
document.addEventListener('change', async e => {
  const d = e.target.dataset; if (d.cfile === undefined) return;
  const files = [...e.target.files], c = colors[+d.cfile]; toast('Yükleniyor…');
  for (const f of files) { try { c.gallery.push(await uploadFile(f)); renderColors(); } catch { toast('Yüklenemedi: ' + f.name); } }
  toast('Fotoğraflar yüklendi');
});

function resetForm() {
  editing = null; $('#pform').reset(); gallery = []; renderImgs(); colors = []; plain = {}; renderColors();
  $('#formTitle').textContent = 'Yeni ürün'; $('#cancelEdit').hidden = true;
}
$('#cancelEdit').onclick = resetForm;

// görselleri tarayıcıda küçültüp yükle (ücretsiz veritabanını şişirmemek için)
async function uploadFile(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 1000 / Math.max(bmp.width, bmp.height));
  const cv = document.createElement('canvas');
  cv.width = Math.round(bmp.width * k); cv.height = Math.round(bmp.height * k);
  cv.getContext('2d').drawImage(bmp, 0, 0, cv.width, cv.height);
  const data = cv.toDataURL('image/jpeg', 0.82).split(',')[1];
  return (await api('admin/images', 'POST', { mime: 'image/jpeg', data })).id;
}
$('#f_file').onchange = async e => {
  const files = [...e.target.files]; if (!files.length) return;
  toast('Yükleniyor…');
  for (const f of files) { try { gallery.push(await uploadFile(f)); renderImgs(); } catch (err) { toast('Yüklenemedi: ' + f.name); } }
  e.target.value = ''; toast('Fotoğraflar yüklendi');
};

$('#pform').onsubmit = async e => {
  e.preventDefault();
  const body = {
    name: $('#f_name').value, description: $('#f_desc').value, details: $('#f_details').value, price: $('#f_price').value,
    stock: $('#f_stock').value, category_id: $('#f_cat').value || null, gallery, active: $('#f_active').checked,
    size_label: $('#f_sizelabel').value, sizes: parseSizes(),
    colors: colors.filter(c => c.name.trim()).map(c => ({ name: c.name, gallery: c.gallery })),
    variants: (() => {
      const sizes = parseSizes(), cols = sizes.length ? sizes : [''];
      return colors.length ? colors.filter(c => c.name.trim()).flatMap(c => cols.map(z => ({ color: c.name.trim(), size: z, stock: c.stock[z] || 0 })))
        : (sizes.length ? sizes.map(z => ({ color: '', size: z, stock: plain[z] || 0 })) : []);
    })(),
    sale_price: $('#f_sale').value, sale_start: $('#f_sstart').value || null, sale_end: $('#f_send').value || null,
  };
  await (editing ? api('admin/products/' + editing, 'PUT', body) : api('admin/products', 'POST', body));
  toast('Kaydedildi'); resetForm(); loadProducts();
};

document.addEventListener('click', async e => {
  const d = e.target.dataset;
  if (d.edit) {
    const p = prods.find(x => x.id == d.edit); editing = p.id;
    $('#f_name').value = p.name; $('#f_desc').value = p.description; $('#f_details').value = p.details || '';
    $('#f_price').value = p.price; $('#f_stock').value = p.stock; $('#f_cat').value = p.category_id || '';
    $('#f_active').checked = p.active;
    $('#f_sale').value = p.sale_price ?? ''; $('#f_sstart').value = p.sale_start || ''; $('#f_send').value = p.sale_end || '';
    gallery = p.gallery?.length ? [...p.gallery] : (p.image_id ? [p.image_id] : []); renderImgs();
    $('#f_sizelabel').value = p.size_label || 'Boy'; $('#f_sizes').value = (p.sizes || []).join(', ');
    const stockOf = (c, z) => p.variants.find(v => v.color === c && v.size === z)?.stock ?? 0;
    colors = (p.colors || []).map(c => ({ name: c.name, gallery: [...c.gallery], stock: Object.fromEntries((p.sizes.length ? p.sizes : ['']).map(z => [z, stockOf(c.name, z)])) }));
    plain = Object.fromEntries((p.sizes || []).map(z => [z, stockOf('', z)]));
    renderColors();
    $('#formTitle').textContent = 'Ürünü düzenle'; $('#cancelEdit').hidden = false;
    scrollTo({ top: 0, behavior: 'smooth' });
  }
  if (d.main !== undefined) { const [x] = gallery.splice(+d.main, 1); gallery.unshift(x); renderImgs(); }
  if (d.cdel !== undefined) { colors.splice(+d.cdel, 1); renderColors(); }
  if (d.crm !== undefined) { const [i, j] = d.crm.split(':').map(Number); colors[i].gallery.splice(j, 1); renderColors(); }
  if (d.rmimg !== undefined) { gallery.splice(+d.rmimg, 1); renderImgs(); }
  if (d.del && confirm('Bu ürün silinsin mi?')) { await api('admin/products/' + d.del, 'DELETE'); loadProducts(); }
  if (d.delcat && confirm('Kategori silinsin mi? (Ürünler kategorisiz kalır)')) { await api('admin/categories/' + d.delcat, 'DELETE'); loadCats(); loadProducts(); }
});

// ---- siparişler ----
const statuses = ['yeni', 'hazırlanıyor', 'kargoda', 'teslim edildi', 'iptal'];
async function loadOrders() {
  const rows = await api('admin/orders');
  $('#otable').innerHTML = rows.map(o => `<tr>
    <td>${o.id}<br><small>${new Date(o.created_at).toLocaleString('tr-TR')}</small></td>
    <td>${esc(o.customer_name)}<br><small>${esc(o.phone)}<br>${esc(o.address)}${o.note ? '<br><em>' + esc(o.note) + '</em>' : ''}</small></td>
    <td>${o.items.map(i => `${i.qty}× ${esc(i.name)}${i.color || i.size ? ' <small>(' + esc([i.color, i.size].filter(Boolean).join(' · ')) + ')</small>' : ''}`).join('<br>')}</td>
    <td>${tl(o.total)}</td>
    <td><select data-status="${o.id}">${statuses.map(s => `<option ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}</select></td></tr>`).join('')
    || '<tr><td colspan="5">Henüz sipariş yok.</td></tr>';
}
document.addEventListener('change', async e => {
  if (e.target.dataset.catimg) {
    const image_id = await uploadFile(e.target.files[0]);
    await api('admin/categories/' + e.target.dataset.catimg, 'PUT', { image_id }); toast('Görsel güncellendi'); return loadCats();
  }
  if (e.target.dataset.status) { await api('admin/orders/' + e.target.dataset.status, 'PUT', { status: e.target.value }); toast('Durum güncellendi'); }
});

fetch('/api/admin/me').then(r => r.ok ? showApp() : showLogin());
</script>
</body>
</html>
