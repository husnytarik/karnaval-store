<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ürün · Karnaval Kırtasiye</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap&subset=latin-ext" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="product">
<main class="wrap">
  <nav class="crumbs"><a href="/">Anasayfa</a> / <span id="crumbCat"></span><span id="crumbName"></span></nav>
  <div id="product" class="pdp" hidden>
    <div class="gallery">
      <div class="main-img ph" id="mainImg"></div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="pinfo">
      <span class="cat" id="pCat"></span>
      <h1 id="pName"></h1>
      <div class="pprice" id="pPrice"></div>
      <div class="sale-note" id="saleNote" hidden></div>
      <p class="pshort" id="pShort"></p>
      <div class="opt" id="colorBox" hidden><div class="olabel">Renk: <b id="colorName"></b></div><div class="chips" id="colorChips"></div></div>
      <div class="opt" id="sizeBox" hidden><div class="olabel"><span id="sizeLabel">Boy</span>: <b id="sizeName"></b></div><div class="chips" id="sizeChips"></div></div>
      <div class="stock" id="pStock"></div>
      <div class="buy" id="buy">
        <div class="qty big"><button id="minus">−</button><span id="qtyVal">1</span><button id="plus">+</button></div>
        <button class="btn lg" id="addBtn">Sepete ekle</button>
      </div>
    </div>
    <section class="pdetail">
      <h2>Ürün detayları</h2>
      <div id="pDetails"></div>
    </section>
  </div>
  <div class="empty" id="missing" hidden>Ürün bulunamadı. <a href="/">Anasayfaya dön</a></div>
</main>

<script src="/shop.js"></script>
<script>
let product = null, qty = 1, color = '', size = '';
const id = new URLSearchParams(location.search).get('id');

function trDate(s) { return new Date(s + 'T00:00:00').toLocaleDateString('tr-TR', { day: 'numeric', month: 'long' }); }
function show(i) {
  const m = $('#mainImg');
  m.classList.remove('ph'); m.style.backgroundImage = `url(${imgUrl(i)})`;
  document.querySelectorAll('.thumbs button').forEach(b => b.classList.toggle('on', b.dataset.img == i));
}
const variantOf = (c, z) => product.variants.find(v => v.color === c && v.size === z);
const colorImgs = c => product.colors.find(x => x.name === c)?.gallery || [];
const baseImgs = () => product.gallery?.length ? product.gallery : (product.image_id ? [product.image_id] : []);
// seçili renge ait fotoğraflar; renk fotoğrafı yoksa ürünün genel fotoğrafları
function renderGallery() {
  const imgs = colorImgs(color).length ? colorImgs(color) : baseImgs();
  if (imgs.length) show(imgs[0]);
  $('#thumbs').innerHTML = imgs.length > 1 ? imgs.map(i => `<button data-img="${i}" class="${i === imgs[0] ? 'on' : ''}" style="background-image:url(${imgUrl(i)})"></button>`).join('') : '';
}
function renderOptions() {
  const p = product, hasV = p.variants.length > 0;
  const colorStock = c => p.variants.filter(v => v.color === c).some(v => v.unlimited) ? 1 : p.variants.filter(v => v.color === c).reduce((a, v) => a + v.stock, 0);
  $('#colorBox').hidden = !p.colors.length;
  $('#colorName').textContent = color;
  $('#colorChips').innerHTML = p.colors.map(c => {
    const t = c.gallery[0];
    return `<button type="button" class="chip ${c.name === color ? 'on' : ''} ${colorStock(c.name) ? '' : 'na'}" data-color="${esc(c.name)}" title="${esc(c.name)}">${t ? `<i style="background-image:url(${imgUrl(t)})"></i>` : ''}${esc(c.name)}</button>`;
  }).join('');
  $('#sizeBox').hidden = !p.sizes.length;
  $('#sizeLabel').textContent = p.size_label || 'Boy';
  $('#sizeName').textContent = size;
  $('#sizeChips').innerHTML = p.sizes.map(z => `<button type="button" class="chip ${z === size ? 'on' : ''} ${(variantOf(color, z)?.unlimited || variantOf(color, z)?.stock) ? '' : 'na'}" data-size="${esc(z)}">${esc(z)}</button>`).join('');
  const unl = hasV ? !!variantOf(color, size)?.unlimited : p.unlimited;
  const stock = unl ? 999 : (hasV ? (variantOf(color, size)?.stock || 0) : p.stock);
  qty = Math.min(Math.max(1, qty), Math.max(1, stock));
  $('#qtyVal').textContent = qty;
  if (stock > 0) {
    $('#pStock').textContent = stockText(stock, unl);
    $('#pStock').className = 'stock ok'; $('#buy').hidden = false;
  } else {
    $('#pStock').textContent = hasV ? 'Bu seçenek tükendi' : 'Tükendi'; $('#pStock').className = 'stock out'; $('#buy').hidden = true;
  }
}
async function load() {
  const res = id ? await fetch('/api/products/' + encodeURIComponent(id)) : { ok: false };
  if (!res.ok) { $('#missing').hidden = false; return; }
  product = await res.json();
  const p = product;
  document.title = `${p.name} · Karnaval Kırtasiye`;
  $('#crumbCat').innerHTML = p.category ? `<a href="/#urunler">${esc(p.category)}</a> / ` : '';
  $('#crumbName').textContent = p.name;
  $('#pCat').textContent = p.category || '';
  $('#pName').textContent = p.name;
  $('#pPrice').innerHTML = priceHtml(p) + (p.on_sale ? ` <span class="tag inline">%${discountPct(p)} indirim</span>` : '');
  if (p.on_sale && p.sale_end) { $('#saleNote').hidden = false; $('#saleNote').textContent = `İndirim ${trDate(p.sale_end)} tarihine kadar geçerli.`; }
  $('#pShort').textContent = p.description;
  $('#pDetails').innerHTML = p.details ? esc(p.details).replace(/\n/g, '<br>') : '<span style="color:var(--muted)">Bu ürün için ek detay girilmemiş.</span>';
  // ilk stokta olan seçeneği önceden seç
  const first = p.variants.find(v => v.stock > 0 || v.unlimited) || p.variants[0];
  color = first?.color || ''; size = first?.size || '';
  renderGallery(); renderOptions();
  $('#product').hidden = false;
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-color]'), z = e.target.closest('[data-size]');
  if (c) {
    color = c.dataset.color;
    // yeni renkte seçili boy yoksa/tükendiyse stokta olan ilk boya geç
    if (!(variantOf(color, size)?.stock > 0 || variantOf(color, size)?.unlimited)) size = product.variants.find(v => v.color === color && (v.stock > 0 || v.unlimited))?.size ?? size;
    renderGallery(); renderOptions();
  }
  if (z) { size = z.dataset.size; renderOptions(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('.thumbs button'); if (b) show(b.dataset.img);
});
$('#minus').onclick = () => { qty = Math.max(1, qty - 1); $('#qtyVal').textContent = qty; };
const curStock = () => { const v = variantOf(color, size); return (product.variants.length ? v?.unlimited : product.unlimited) ? 999 : (product.variants.length ? (v?.stock || 0) : product.stock); };
$('#plus').onclick = () => { qty = Math.min(curStock(), qty + 1); $('#qtyVal').textContent = qty; };
$('#addBtn').onclick = () => addToCart(product, qty, product.variants.length ? { color, size, stock: curStock(), unlimited: !!variantOf(color, size)?.unlimited, image: colorImgs(color)[0] } : undefined);
const onOrderDone = load;
load();
</script>
</body>
</html>
