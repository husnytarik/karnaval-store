<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Karnaval Kırtasiye — Stanley Kişiselleştirilmiş Ürünler</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/store.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <span class="logo-name">Karnaval</span>
        <span class="logo-tag">Kırtasiye</span>
      </div>
      <div class="header-badge">Özelleştir</div>
    </header>

    <div class="hero-strip">
      Her ürüne adınızı işleyin — kalıcı, profesyonel, anlamlı
    </div>

    <main>
      <div class="section-header">
        <div class="section-title">Koleksiyon</div>
        <div class="section-sub">
          Ürüne tıklayarak renk, kapasite ve kişiselleştirme seçeneklerini görün
        </div>
      </div>
      <div class="grid" id="product-grid">
        <div class="grid-empty">Yükleniyor...</div>
      </div>
    </main>

    <!-- MODAL -->
    <div class="overlay" id="overlay" onclick="handleOverlayClick(event)">
      <div class="overlay-inner">
        <button class="modal-close" onclick="closeModal()">✕</button>
        <div class="modal" onclick="event.stopPropagation()">
          <div class="modal-inner">
            <div class="modal-img-side">
              <div class="modal-img-wrap" id="modal-img"></div>
              <div class="modal-thumbs" id="modal-thumbs"></div>
            </div>
            <div class="modal-form" id="modal-form"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="js/supabase.js"></script>
    <script src="js/store.js"></script>
  </body>
</html>
